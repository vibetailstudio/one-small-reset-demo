<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free demo of One Small Reset, an ADHD-friendly cleaning planner that gives you one small task at a time.">
<title>One Small Reset Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one calm column, a single decision at a time; bottom tab bar like a phone app. */
:root{
  --bg:#F4F0E8; --surface:#FFFDF9; --surface-2:#F8F4EC; --ink:#22302B; --muted:#55645E; --line:#E7E0D2;
  --accent:#237565; --accent-ink:#FFFFFF; --accent-soft:#D9EFE9; --warm:#F4C9A8; --warm-ink:#5A3418;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
:root[data-pal="lilac"]{--accent:#5D4BBD;--accent-soft:#E6E1FA}
:root[data-pal="peach"]{--accent:#AD4C28;--accent-soft:#FBE4D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141A18;--surface:#1D2623;--surface-2:#232E2A;--ink:#EAF1EE;--muted:#9FB0AA;--line:#2F3B37;--accent:#5CC4AE;--accent-ink:#0E1A17;--accent-soft:#1F3A34;--warm:#6A4630;--warm-ink:#FBE4D8;color-scheme:dark}
  :root:not([data-theme="light"])[data-pal="lilac"]{--accent:#A99BF0;--accent-soft:#2B2650}
  :root:not([data-theme="light"])[data-pal="peach"]{--accent:#F09B78;--accent-soft:#48291C}}
:root[data-theme="dark"]{--bg:#141A18;--surface:#1D2623;--surface-2:#232E2A;--ink:#EAF1EE;--muted:#9FB0AA;--line:#2F3B37;--accent:#5CC4AE;--accent-ink:#0E1A17;--accent-soft:#1F3A34;--warm:#6A4630;--warm-ink:#FBE4D8;color-scheme:dark}
:root[data-theme="dark"][data-pal="lilac"]{--accent:#A99BF0;--accent-soft:#2B2650}
:root[data-theme="dark"][data-pal="peach"]{--accent:#F09B78;--accent-soft:#48291C}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:clamp(16px,4.8vw,21px);letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
.dots{display:flex;gap:6px;align-items:center;flex:none}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);outline:2px solid transparent;cursor:pointer;padding:0}
.dot[aria-pressed="true"]{outline-color:var(--ink)}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;padding:0;margin-left:4px}
.gear[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6.5vw,34px);line-height:1.08;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
p{margin:0}.muted{color:var(--muted)}.fine{font-size:13px;color:var(--muted);text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(60,45,20,.04),0 8px 24px -16px rgba(60,45,20,.18)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.hero svg{flex:none;width:76px;height:76px;color:var(--accent)}
.ico{flex:none;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.ico svg{width:22px;height:22px}
.rh{display:flex;align-items:center;gap:10px;min-width:0}.rh h2{overflow-wrap:anywhere}
.card.focus{border:2px solid var(--accent)}
.card.note{background:var(--accent-soft);border-color:transparent}
.card.lock{border-style:dashed;align-items:flex-start}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.four{display:grid;grid-template-columns:1fr 1fr}.col2{display:flex;flex-direction:column;gap:10px}
.chip{flex:1 1 70px;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:500 15px var(--body);cursor:pointer;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.chip b{font-family:var(--display);font-size:15px}
.chip small{color:var(--muted);font-size:11px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn{min-height:54px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--body);cursor:pointer;padding:0 20px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{min-height:42px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.text{background:transparent;color:var(--muted);min-height:40px;font-size:14px;text-decoration:underline;padding:0 6px;border:0}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 130px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(24px,6vw,30px);line-height:1.12;text-wrap:balance;overflow-wrap:anywhere}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.steps li::marker{color:var(--accent);font-weight:700}
.task{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.task{flex-wrap:wrap}select.mins{flex:none;width:64px;min-height:42px}.task .t{flex:1;min-width:110px}.task .t b{display:block;font-weight:700;overflow-wrap:anywhere}
.task .meta{font-size:13px;color:var(--muted)}
.task.done .t b{color:var(--muted)}.task.done .t b{text-decoration:line-through}
.check{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent-ink);cursor:pointer;font-size:18px;line-height:1;padding:0}
.check[aria-pressed="true"],.check.on{background:var(--accent);display:grid;place-items:center}
.pill{display:inline-block;background:var(--warm);color:var(--warm-ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
.wins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.win{background:var(--accent-soft);border-radius:16px;padding:12px 6px;text-align:center}
.win b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--accent)}
.win span{font-size:12px;color:var(--muted)}
.roomhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
form.stack{display:flex;flex-direction:column;gap:8px}
.add{display:flex;gap:8px}
input[type=text],select,textarea{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:400 15px var(--body);padding:0 12px}
textarea{width:100%;min-height:84px;padding:10px 12px;resize:vertical}
textarea.code{font:400 12px ui-monospace,Menlo,Consolas,monospace;min-height:110px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:36px;display:flex;align-items:center}
details .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
details label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{min-width:64px;min-height:36px;border-radius:99px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);font:700 13px var(--body);cursor:pointer;flex:none}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));z-index:5}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{min-height:52px;border:0;border-radius:14px;background:transparent;color:var(--muted);font:700 13px var(--body);cursor:pointer}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.timer{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:auto}
.ring{width:min(60vw,240px);aspect-ratio:1;position:relative;max-width:100%;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(40px,13vw,58px);font-variant-numeric:tabular-nums}
.timer .steps{text-align:left;max-width:420px}
.timer details{width:100%;max-width:420px}.timer summary{justify-content:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px);text-align:center}
.pop{position:fixed;left:50%;top:40%;pointer-events:none;z-index:40}
.pop i{position:absolute;width:10px;height:10px;border-radius:3px;background:var(--accent);animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.badge body{padding-bottom:176px}.badge nav{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}.badge .toast{bottom:164px}
@media (prefers-reduced-motion: reduce){.pop{display:none}.ring .fg{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">One Small <span>Reset</span></div>
    <div class="dots" role="group" aria-label="Color theme and settings">
      <button class="dot" data-a="pal" data-id="sage" style="background:#237565" aria-label="Sage theme"></button>
      <button class="dot" data-a="pal" data-id="lilac" style="background:#5D4BBD" aria-label="Lilac theme"></button>
      <button class="dot" data-a="pal" data-id="peach" style="background:#AD4C28" aria-label="Peach theme"></button>
      <button class="gear" data-a="tab" data-id="settings" aria-label="Settings and backup">⚙</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav aria-label="Sections"><div>
  <button data-a="tab" data-id="today">Today</button>
  <button data-a="tab" data-id="rooms">Rooms</button>
  <button data-a="tab" data-id="routines">Resets</button>
  <button data-a="tab" data-id="wins">Wins</button>
</div></nav>
<div id="overlay"></div>

<script>
const DEMO=true;
const BADGE=false;  // true only on the host that adds its own corner badge
if(BADGE)document.documentElement.classList.add("badge");
const FILEIO=false;  // true only in the downloadable file that is sold
const SEED={
 Kitchen:[["Clear one counter",5,1,["Pick the counter nearest the sink","Dishes to the sink, toss the trash","Stop when that one counter is clear"]],["Load or unload the dishwasher",10,2,["Open it and check: clean or dirty?","Do the top rack first","Bottom rack, then close the door"]],["Wipe the stove top",5,1,["Move anything sitting on the stove","Wet a cloth or grab a wipe","Wipe once, back to front. Done"]],["Take out the trash",5,1,["Tie the bag","Walk it out","Put in a new bag"]],["Wipe one fridge shelf",15,3,["Pick ONE shelf and empty it","Toss anything expired","Wipe, put things back, stop there"]],["Sweep the kitchen floor",10,2,["Grab the broom","Sweep toward one corner","Scoop the pile into the trash can"]]],
 Bathroom:[["Wipe the sink and mirror",5,1,["Clear the sink edge","Wipe the mirror first","Then the sink and faucet"]],["Swap the towels",5,1,["Used towels to the hamper","Hang fresh ones"]],["Scrub the toilet",10,2,["Cleaner in the bowl","Wipe the seat and outside","Brush, flush, done"]],["Clean the shower",15,3,["Take the bottles out","Spray walls and floor","Rinse and put the bottles back"]],["Empty the bathroom trash can",5,1,["Tie the bag","Take it to the main trash","New bag in"]]],
 Bedroom:[["Make the bed (messy is fine)",5,1,["Pull the sheet up","Pull the comforter up","Pillows on top. That's it"]],["Clothes off the floor into one basket",5,1,["Get one basket","Everything fabric goes in","No sorting right now"]],["Clear the nightstand",5,1,["Cups and trash out","Keep the 3 things you actually use","Wipe it only if you feel like it"]],["Change the sheets",15,3,["Strip the bed","Fitted sheet on, corner by corner","Comforter and pillowcases"]],["Put away one basket of laundry",10,2,["Hanging things first","Then drawers","Basket back in its spot"]]],
 "Living room":[["Collect cups and plates",5,1,["One lap around the room","Carry everything to the sink"]],["Fold the blankets",5,1,["Shake each one out","Fold in half twice","Stack them in one spot"]],["Clear the coffee table",5,1,["Trash first","Things that live elsewhere go in one pile","Take the pile on your next trip"]],["Vacuum the main path",10,2,["Just the path you walk on","Skip under the furniture today"]],["Dust the shelves",15,3,["One shelf at a time, top first","Lift, wipe, put back","Stop whenever the timer ends"]]],
 "Home office":[["Clear the desk surface",5,1,["Cups and trash off first","Stack loose papers in one pile","Leave only what you use daily"]],["Toss old papers and wrappers",5,1,["Grab a bag","Anything clearly trash goes in","Stop when the bag is half full"]],["Wipe the keyboard and screen",5,1,["Dry cloth on the screen","Tip the keyboard and shake it out","Quick wipe of the mouse"]],["Sort one paper pile",10,2,["Three piles: keep, act, recycle","Recycle pile goes out now","Act pile gets one spot on the desk"]],["Tidy the cables",15,3,["Unplug what you never use","Bundle the rest with a tie","Tuck them behind the desk"]]],
 "Kids' room":[["Toys into one bin",5,1,["Get one big bin","Everything on the floor goes in","No sorting today"]],["Books back on the shelf",5,1,["Collect them in one stack","Shelve them any way up"]],["Dirty clothes to the hamper",5,1,["One lap of the room","If in doubt, it is dirty"]],["Clear a walking path",10,2,["Door to bed first","Push things to the edges","Toss whatever is broken"]],["Sort one toy box",15,3,["Tip out ONE box","Broken or outgrown goes in a bag","Everything else back in"]]],
 "Pet corner":[["Wash the food and water bowls",5,1,["Empty and rinse","Quick scrub with soap","Refill the water"]],["Shake out the pet bed",5,1,["Take it outside or to a window","Shake, then put it back"]],["Scoop the litter box or yard",5,1,["Grab a bag","Scoop what you can see","Bag out to the trash"]],["Sweep up fur and crumbs",10,2,["Just around the bowls and bed","Sweep into one pile","Pile into the trash can"]],["Wash the pet blanket",10,2,["Shake it out first","Into the machine","Set a reminder to hang it"]]],
 Car:[["Trash out of the car",5,1,["Take one bag to the car","Front seats and door pockets","Bag straight to the trash can"]],["Bring in cups and bottles",5,1,["Collect everything in one trip","Leave them by the sink"]],["Shake out the floor mats",5,1,["Pull out the front mats","Shake or bang them","Back in place"]],["Wipe the dashboard",10,2,["One damp cloth","Dashboard, then the wheel","Door handles if you feel like it"]],["Vacuum the seats",15,3,["Front seats only","Then the footwells","Stop when the timer ends"]]],
 "Entry & laundry":[["Shoes back on the rack",5,1,["Pair them up","Rack or one neat row"]],["Start one load of laundry",5,1,["Grab whatever is closest to a full load","Detergent in, press start"]],["Move laundry to the dryer",5,1,["Wet clothes into the dryer or onto the rack","Press start"]],["Sort the mail pile",10,2,["Obvious junk straight to recycling","Open the rest","Keep one small to-do pile"]],["Wipe the door handles",5,1,["One damp cloth","Front door first","Then any others you pass"]]]
};
const EXTRA=["Home office","Kids' room","Pet corner","Car"];
const ICON={Kitchen:"pot",Bathroom:"drop",Bedroom:"bed","Living room":"sofa","Entry & laundry":"door","Home office":"desk","Kids' room":"star","Pet corner":"paw",Car:"car"};
const ICONS={pot:'<path d="M4 10h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.500 6-11 6-11z"/>',bed:'<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 15h18M7 9V7h4v2M3 18v2M21 18v2"/>',sofa:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"/>',door:'<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14.500 12h.01"/>',desk:'<path d="M4 5h16v10H4zM9 19h6M12 15v4"/>',star:'<path d="M12 3l2.600 5.600 6.100.700-4.500 4.200 1.200 6-5.400-3-5.400 3 1.200-6L3.300 9.300l6.100-.7z"/>',paw:'<path d="M12 13c-3 0-5 2.500-5 4.500S9 20 12 20s5-.5 5-2.500S15 13 12 13z"/><circle cx="6.500" cy="10.500" r="1.500"/><circle cx="10" cy="6.500" r="1.500"/><circle cx="14" cy="6.500" r="1.500"/><circle cx="17.500" cy="10.500" r="1.500"/>',car:'<path d="M3 16v-3l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v3z"/><path d="M3 13h18M7 16v2M17 16v2"/>',spark:'<path d="M12 4v5M12 15v5M4 12h5M15 12h5"/>'};
const ico=k=>`<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.spark}</svg></span>`;
const PLANT='<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 52h28l-3 20H29z" fill="var(--warm)" stroke="var(--warm-ink)"/><path d="M40 52V30"/><path d="M40 40c-10 0-15-6-15-14 9 0 15 5 15 14z" fill="var(--accent-soft)"/><path d="M40 34c9 0 14-5 14-13-8 0-14 5-14 13z" fill="var(--accent-soft)"/><path d="M62 30v6M59 33h6M16 44v5M13.500 46.500h5M60 10v4M58 12h4"/></svg>';
const TINY=["Throw away 3 pieces of trash","Put one cup in the sink","Hang up one towel","Put one thing back where it lives","Wipe one small spot","Open a window for fresh air"];
const RSEED={"Morning reset":["Open the curtains","Make the bed","Dishes to the sink"],"Evening reset":["10-item pickup","Start the dishwasher","Trash to the door"]};
const V=5;
const KEY=DEMO?"onesmallreset-demo":"onesmallreset";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const shortDate=()=>new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
function fresh(){let n=0;const rn=DEMO?["Kitchen"]:Object.keys(SEED),qn=DEMO?["Morning reset"]:Object.keys(RSEED);
  const rooms=rn.map(name=>({id:"r"+(++n),name,icon:ICON[name],hidden:EXTRA.includes(name),tasks:SEED[name].map(([nm,min,en,steps])=>({id:"t"+(++n),name:nm,min,en,steps}))}));
  const routines=qn.map(name=>({id:"q"+(++n),name,steps:RSEED[name].map(s=>({id:"s"+(++n),name:s}))}));
  return {v:V,n,day:today(),pal:"sage",tab:"today",seen:false,energy:1,time:5,more:false,picks:[],skipped:[],rest:"",done:{},once:[],logged:[],rooms,routines,sound:false,party:true,zones:false,part:{},timer:null,wins:{tasks:0,min:0,days:0},lastWinDay:""}}
let S=fresh(),EDIT=null,BACKUP=false,ELSE=false,SAVED=true;
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===V&&Array.isArray(o.rooms))S=Object.assign(fresh(),o)}}catch(e){}
function newDay(){if(S.day!==today()){S.day=today();S.done={};S.picks=[];S.skipped=[];S.once=[];S.logged=[];S.part={};S.rest=""}}  // nothing ever carries over as overdue
newDay();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));SAVED=localStorage.getItem(KEY)!==null}catch(e){SAVED=false}};
const $=s=>document.querySelector(s), esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const visible=()=>S.rooms.filter(r=>!r.hidden);
const tiny=()=>TINY.map((n,i)=>({id:"tiny"+i,name:n,min:1,en:0,room:"60 seconds",steps:[]}));
function find(id){for(const r of S.rooms){const t=r.tasks.find(t=>t.id===id);if(t)return Object.assign({room:r.name,icon:r.icon||"spark"},t)}

   if(!f.dataset.sure){f.dataset.sure=1;f.querySelector("button").textContent="Tap again: this replaces everything here";return}
   S=Object.assign(fresh(),o);newDay();toast("Backup restored.")}
  save();render();if(now)timer(now)});
save();if(!S.picks.length&&!S.rest)repick();  // open straight onto one task that matches the visible choices
render();if(S.timer)timer(S.timer.id,true);
</script>
